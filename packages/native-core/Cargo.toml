[package]
name = "repoready-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
jsonschema = { version = "=0.59.0", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = "=0.11.0"
base64 = "=0.23.1"
hex = "=0.4.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "json"] }
minisign-verify = "=0.3.0"
semver = "=1.0.28"

[dev-dependencies]
tempfile = "=3.27.0"

