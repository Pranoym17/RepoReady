[package]
name = "repoready-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater"]

[dependencies]
repoready-core = { path = "../../../packages/native-core" }
serde_json.workspace = true
tauri = { version = "=2.12.3", optional = true }
tauri-plugin-updater = { version = "=2.14.0", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.2", optional = true }
