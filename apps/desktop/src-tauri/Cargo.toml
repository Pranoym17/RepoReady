[package]
name = "repoready-desktop"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater"]

[dependencies]
repoready-core = { path = "../../../packages/native-core" }
serde_json.workspace = true
tauri = { version = "=2.12.3", optional = true }
tauri-plugin-updater = { version = "=2.14.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "=2.7.2", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
